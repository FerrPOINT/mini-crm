name: mini-crm
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?required}
      REST_DB_PASSWORD: ${REST_DB_PASSWORD:?required}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    depends_on:
      db: { condition: service_healthy }
    ports: [127.0.0.1:54329:9999]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:?required}/api/auth/v1
      GOTRUE_SITE_URL: ${PUBLIC_URL:?required}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?required}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?required}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 2
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UP: 30
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:9999/health']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${REST_DB_PASSWORD:?required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?required}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_POOL: 10
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
    ports: ['${WEB_BIND:-127.0.0.1}:8788:8080']
    networks: [default, ingress]
    environment:
      TRUSTED_PROXY_SUBNET: ${CRM_INGRESS_SUBNET:-172.31.255.0/29}
      NGINX_ENVSUBST_FILTER: ^TRUSTED_PROXY_SUBNET$
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [public]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      web: { condition: service_healthy }
    networks: [ingress]
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, 'http://web:8080']
    logging: *logging
volumes:
  db-data:
  db-config:
networks:
  ingress:
    ipam:
      config:
        - subnet: ${CRM_INGRESS_SUBNET:-172.31.255.0/29}
